<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Video Platform - Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 500px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 30px;
        opacity: 0.8;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 15px;
        font-weight: 600;
      }

      p {
        font-size: 16px;
        color: #cccccc;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .status {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
      }

      .status-item {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 10px 0;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff6b6b;
      }

      .status-indicator.checking {
        background: #ffd93d;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        font-weight: 600;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .offline-message {
        margin-top: 20px;
        padding: 15px;
        background: rgba(255, 107, 107, 0.1);
        border-left: 4px solid #ff6b6b;
        border-radius: 4px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8.111 16H5a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2v8m-5-6h.01M9 20h6a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"
        ></path>
      </svg>

      <h1>You're Offline</h1>
      <p>It looks like you've lost your internet connection. Some features may not be available.</p>

      <div class="status">
        <div class="status-item">
          <span class="status-indicator checking"></span>
          <span>Checking connection...</span>
        </div>
      </div>

      <button onclick="location.reload()">Try Again</button>

      <div class="offline-message">
        <strong>Good news!</strong> You can still watch videos you've previously loaded. Check your
        watchlist or recently viewed videos.
      </div>
    </div>

    <script>
      // Check for connection periodically
      let isOnline = navigator.onLine;

      window.addEventListener('online', () => {
        if (!isOnline) {
          isOnline = true;
          location.reload();
        }
      });

      window.addEventListener('offline', () => {
        isOnline = false;
      });

      // Attempt to reload every 5 seconds
      setInterval(() => {
        if (navigator.onLine) {
          location.reload();
        }
      }, 5000);
    </script>
  </body>
</html>
