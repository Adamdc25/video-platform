<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2937">
  <title>Video Platform - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #000000 0%, #1f2937 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      color: #ffffff;
    }

    .offline-container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    .offline-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 2rem;
      opacity: 0.7;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.1rem;
      color: #d1d5db;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-primary {
      background-color: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #374151;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
      transform: translateY(-2px);
    }

    .status {
      margin-top: 2rem;
      padding: 1rem;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid #3b82f6;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      color: #93c5fd;
    }

    @media (max-width: 640px) {
      .offline-container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <svg class="offline-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
    </svg>

    <h1>You're Offline</h1>

    <p>
      It looks like you've lost your internet connection. Don't worry! You can still access cached content
      from your previous visits or try reconnecting.
    </p>

    <div class="offline-actions">
      <button class="btn-primary" onclick="location.reload()">
        Try Again
      </button>
      <button class="btn-secondary" onclick="goHome()">
        Go to Home
      </button>
    </div>

    <div class="status">
      <strong>Connection Status:</strong> Offline
      <br>
      When you reconnect to the internet, you'll be able to stream videos and access all features.
    </div>
  </div>

  <script>
    function goHome() {
      window.location.href = '/';
    }

    // Check for online status periodically
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
